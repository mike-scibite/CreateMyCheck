name: JFrog security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

# actions/checkout uses this token only to read the pull-request commit. The
# Check Run and PR comment are created with the GitHub App installation token
# below.
permissions:
  contents: read

jobs:
  create-check-run:
    # GitHub does not make repository secrets available to workflows started by
    # fork PRs.  This also avoids exposing the App private key to untrusted code.
    if: github.event.pull_request.head.repo.fork == false
    environment: Mike
    runs-on: ubuntu-latest
    env:
      APP_ID: ${{ secrets.TOY_CHECK_APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.TOY_CHECK_APP_PRIVATE_KEY }}
      API_URL: ${{ github.api_url }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_ID: ${{ github.event.repository.id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read the pull-request version of check_result.txt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Publish JFrog security scan result
        shell: bash
        run: |
          set -euo pipefail

          # A GitHub App JWT is valid for at most ten minutes.  The App ID is
          # the JWT issuer; it is an identifier, not a credential.
          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | base64url)"
          payload="$(jq -nc \
            --arg iss "$APP_ID" \
            --argjson iat "$((now - 60))" \
            --argjson exp "$((now + 540))" \
            '{iat: $iat, exp: $exp, iss: $iss}' | base64url)"
          unsigned_jwt="${header}.${payload}"
          signature="$(printf '%s' "$unsigned_jwt" | openssl dgst -sha256 -sign "$key_file" | base64url)"
          app_jwt="${unsigned_jwt}.${signature}"

          # Find this repository's installation rather than storing an
          # installation ID. Then mint a one-hour token limited to this repo
          # and the permissions needed to create the check and comment on the
          # pull request.
          installation="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "$API_URL/repos/$REPOSITORY/installation")"
          installation_id="$(jq -er '.id' <<<"$installation")"

          token_request="$(jq -nc \
            --argjson repository_id "$REPOSITORY_ID" \
            '{repository_ids: [$repository_id], permissions: {checks: "write", issues: "write"}}')"
          installation_token="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $app_jwt" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            --data "$token_request" \
            "$API_URL/app/installations/$installation_id/access_tokens" \
            | jq -er '.token')"

          # Count only severity cells in the JFrog "Vulnerable Components"
          # table. This excludes scanner log lines and any text after the
          # table, which can contain severity words but is not a finding.
          declare -A findings=(
            [Critical]=0
            [High]=0
            [Medium]=0
            [Low]=0
            [Unknown]=0
          )
          if [[ -f check_result.txt ]]; then
            while IFS=$'\t' read -r severity count; do
              findings["$severity"]="$count"
            done < <(
              awk -F '│' '
                /^Vulnerable Components[[:space:]]*$/ { awaiting_table = 1; next }
                awaiting_table && /^┌/ { in_table = 1; awaiting_table = 0; next }
                in_table && /^└/ { in_table = 0; next }
                in_table {
                  severity = $3
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", severity)
                  if (severity == "Critical" || severity == "High" || severity == "Medium" || severity == "Low" || severity == "Unknown") {
                    counts[severity]++
                  }
                }
                END {
                  for (severity in counts) print severity "\t" counts[severity]
                }
              ' check_result.txt
            )
          fi

          critical="${findings[Critical]}"
          high="${findings[High]}"
          medium="${findings[Medium]}"
          low="${findings[Low]}"
          unknown="${findings[Unknown]}"

          if (( critical > 0 )); then
            conclusion='failure'
            title='🚨 Critical JFrog security findings'
            status_message="❌ $critical Critical finding(s) require remediation."
          elif (( high > 0 )); then
            conclusion='action_required'
            title='⚠️ High JFrog security findings need attention'
            status_message="⚠️ $high High finding(s) need attention."
          else
            conclusion='success'
            title='✅ JFrog security scan passed'
            status_message='✅ No Critical or High findings.'
          fi

          statistics="$(printf '| Severity | Events |\n| --- | ---: |\n| 🚨 Critical | %s |\n| 🔴 High | %s |\n| 🟠 Medium | %s |\n| 🟡 Low | %s |\n| ⚪ Unknown | %s |' \
            "$critical" "$high" "$medium" "$low" "$unknown")"
          summary="$(printf '## JFrog security scan\n\n%s\n\n%s' "$status_message" "$statistics")"

          comment="$summary"
          comment_payload="$(jq -nc --arg body "$comment" '{body: $body}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $installation_token" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            --data "$comment_payload" \
            "$API_URL/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            | jq '{id, html_url}'

          check_run="$(jq -nc \
            --arg name 'JFrog security scan' \
            --arg head_sha "$PR_HEAD_SHA" \
            --arg conclusion "$conclusion" \
            --arg title "$title" \
            --arg summary "$summary" \
            '{name: $name, head_sha: $head_sha, status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}')"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $installation_token" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -H 'Content-Type: application/json' \
            --data "$check_run" \
            "$API_URL/repos/$REPOSITORY/check-runs" \
            | jq '{id, name, status, conclusion, html_url}'

          # Keep the PR comment and Check Run visible before failing the
          # workflow for Critical findings.
          if (( critical > 0 )); then
            exit 1
          fi
