name: XRay security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  publish-report:
    # Repository secrets are unavailable to fork PRs. This also prevents an
    # untrusted fork from receiving the GitHub App private key.
    if: github.event.pull_request.head.repo.fork == false
    uses: ./.github/workflows/reusable-xray-report.yml
    with:
      environment-name: Mike
      report-path: check_result.txt
      product-name: XRay
      check-name: XRay security scan
      pr-number: ${{ github.event.pull_request.number }}
      pr-head-sha: ${{ github.event.pull_request.head.sha }}
      repository-id: ${{ github.event.repository.id }}
